<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1> Forms in HTML</h1>
    <hr>
    <Form>
        <fieldset>
            <legend> Student Regestration Form</legend>
            <label for="Roll number">Roll no.:</label>
            <input type="tel" id="Roll number" name="Roll number"><br>
            <label for="Student Full name">Student Name:</label>
            <input type="text" id="Name" name="Name"><br>
            <label for="Father's name">Father's Name:</label>
            <input type="text" id="Father's name" name="Father's name"><br>
            <label for="Date Of Birth">Date Of Birth:</label>
            <input type="date" id="DOB" name="DOB"><br>
            <label for="Mobile NUmber">Mobile Number:</label>
            <input type="tel" id="Mobile Number" name="Mobile Number"><br>
            <label for="Email ID">Email ID:</label>
            <input type="email" id="Email ID" name="Email ID"><br>
            <label for="Password">Password:</label>
            <input type="password" id="Password" name="Password"><br>
            <label for="Gender">Gender:</label>
            <label for="Male">Male</label>
            <input type="radio" id="Male" name="Gender" value="Male">
            <label for="Female">Female</label>
            <input type="radio" id="Female" name="Gender" value="Female"><br>
            <label for="Department">Department:</label>
            <label for="CS">CS</label>
            <input type="checkbox" id="CS" name="Department">
            <label for="Mechanical">Mechanical</label>
            <input type="checkbox" id="Mechanical" name="Department"><br>
            <label for="Course">Course:</label>
            <select id="Course" name="Course">
                <option value="B.Tech">B.Tech</option>
                <option value="M.Tech">M.Tech</option>
                <option value="MBA">MBA</option>
                <option value="BBA">BBA</option>
            </select><br>
            <label for="Student Photo">Student Photo:</label>
            <input type="file" id="Student Photo" name="Student Photo"><br>
            <label for="City">City:</label>
            <input type="text" id="City" name="City"><br>
            <label for="Address">Address:</label>
            <textarea id="Address" name="Address" rows="4" cols="50"></textarea><br>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">

        </fieldset>
    </Form>
</body>
</html>
